# Local SQL Server for development. Start with:  docker compose up -d
# SEC-11: the SA password is NOT hardcoded - set MSSQL_SA_PASSWORD in your .env
# (compose reads it automatically), e.g.:
#   MSSQL_SA_PASSWORD=Your_strong_Pass123   # used by this compose file
#   SQLSERVER_HOST=localhost
#   SQLSERVER_USER=sa
#   SQLSERVER_PASSWORD=Your_strong_Pass123  # must match MSSQL_SA_PASSWORD
#   SQLSERVER_DATABASE=stellar_trader
#   SQLSERVER_TRUST_CERT=true               # DEV ONLY: container uses a self-signed cert
# The app creates the "stellar_trader" database and tables on first boot.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: stellar-trader-sql
    environment:
      ACCEPT_EULA: "Y"
      # SEC-11: fail if unset rather than ship a known password.
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in your .env}"
      MSSQL_PID: "Developer"
    ports:
      # SEC-11: bind to loopback so the DB isn't reachable from other machines.
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  mssql-data:
