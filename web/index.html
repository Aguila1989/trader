    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Atrium</title>
    <!-- PWA + native-shell (Capacitor) metadata. The Capacitor iOS/Android
         wrapper serves this same built SPA; the manifest also makes it
         installable ("Add to Home Screen") on mobile browsers. Store-grade
         PNG icons (192/512, maskable) still need to be added under web/public
         and listed in manifest.webmanifest before submission. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atrium" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
