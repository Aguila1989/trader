name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm install

      - name: Install web dependencies
        run: npm install --prefix web

      - name: Install admin-web dependencies
        run: npm install --prefix admin-web

      - name: Backend typecheck
        run: npx tsc --noEmit

      - name: Backend tests
        run: npx vitest run

      - name: Web typecheck
        working-directory: web
        run: npx vue-tsc -b --noEmit

      - name: Admin-web typecheck and build
        working-directory: admin-web
        run: npm run build
